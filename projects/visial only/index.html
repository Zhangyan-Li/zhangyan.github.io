
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sunflower Color Expansion</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #111;
}

.photo {
  position: relative;
  width: 100%;
  height: 100vh;
  overflow: hidden;
}

.photo > img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* Shared hotspot settings */
.hotspot {
  position: absolute;
  width: 100px;
  height: 100px;
  z-index: 2;
}

/* Color circle */
.color {
  position: absolute;
  width: 40px;
  height: 40px;
  left: 30px;
  top: 30px;
  border-radius: 50%;
  transform: scale(0);
  transition: transform 3s ease;
  pointer-events: none;
}

/* Expand when the mouse enters a hotspot */
.hotspot:hover .color {
  transform: scale(60);
}

/* 1. Sunflower yellow */
.yellow {
  left: 65%;
  top: 15%;
}

.yellow .color {
  background: #F5C928;
}

/* 2. Dark brown flower center */
.brown {
  left: 60%;
  top: 3%;
}
.brown2 {
  left: 40%;
  top: 3%;
}
.green3 {
  left: 50%;
 bottom: 80%;
}

.brown .color {
  background: #49351D;
}

/* 3. Dark green leaves */
.green {
  left: 55%;
  top: 48%;
}

.green .color {
  background: #46552C;
}

/* 4. Light green leaves */
.lightgreen {
  left: 20%;
  top: 45%;
}

.lightgreen .color {
  background: #84964D;
}

/* 5. Blue gray sky */
.blue {
  left: 5%;
  top: 30%;
}

.blue .color {
  background: #AAB6C2;
}
</style>
</head>

<body>

<div class="photo">

  <!-- Original photograph -->
  <img src="original.jpg" alt="Sunflowers under the sky">

  <!-- Yellow flower petals -->
  <div class="hotspot yellow">
    <div class="color"></div>
  </div>

  <!-- Brown flower center -->
  <div class="hotspot brown">
    <div class="color"></div>
  </div>
  <div class="hotspot brown brown2">
    <div class="color"></div>
  </div>
  <div class="hotspot green green3">
    <div class="color"></div>
  </div>

  <!-- Dark green leaves -->
  <div class="hotspot green">
    <div class="color"></div>
  </div>

  <!-- Light green leaves -->
  <div class="hotspot lightgreen">
    <div class="color"></div>
  </div>

  <!-- Blue gray sky -->
  <div class="hotspot blue">
    <div class="color"></div>
  </div>

</div>

</body>
</html>
